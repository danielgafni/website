base_url = "https://gafni.dev"
title = "~/danielgafni"
author = "Daniel Gafni"
minify_html = true
generate_feeds = true
feed_filenames = ["atom.xml"]
theme = "tabi"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

taxonomies = [
    {name = "tags", feed = true},
]

ignored_content = [
    # https://github.com/getzola/zola/issues/2556
    "**/.venv",
    "**/.venv/**",
    "**/README.*",
    "content/blog/cracking-python-monorepo/uv-dagger-dream/**"
]

[markdown]
# add markdown heading links
insert_anchor_links = "left"
render_emoji = true
smart_punctuation = true
bottom_footnotes = true

[markdown.highlighting]
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"
error_on_missing_language = true

[extra]
author = "danielgafni"
theme_switcher = true
default_theme = "dark"
skin = "catppuccin"
browser_theme_color = ["#ca35a5", "#f386a1"]
favicon = "favicon.png"

# git integration
remote_repository_url = "https://github.com/danielgafni/website"
remote_repository_git_platform = "auto"
remote_repository_branch = "master"
show_remote_changes = true
show_remote_source = true

menu = [
    { name = "/blog", url = "blog", trailing_slash = true },
    { name = "/archive", url = "archive", trailing_slash = true },
    { name = "/tags", url = "tags", trailing_slash = true },
    { name = "/projects", url = "projects", trailing_slash = true },
    { name = "/about", url = "about", trailing_slash = true },
]
quick_navigation_buttons = true
toc = true
show_previous_next_article_links = true
show_reading_time = true

copy_button = true

socials = [
    { name = "github", url = "https://github.com/danielgafni", icon = "github" },
    { name = "gitlab", url = "https://gitlab.com/danielgafni", icon = "gitlab" },
    { name = "linkedin", url = "https://www.linkedin.com/in/danielgafni/", icon = "linkedin" },
]

email = "ZGFuaWVsZ2FmbmkxNkBnbWFpbC5jb20K"

copyright = "UNLICENSED $CURRENT_YEAR $AUTHOR $SEPARATOR The contents of this website are free to use"

[extra.giscus]
enabled_for_all_posts = true
automatic_loading = true
repo = "danielgafni/website"
repo_id = "R_kgDOLfTdug"
category = "Announcements"
category_id = "DIC_kwDOLfTdus4CePI8"
mapping = "slug"
strict_title_matching = 1  # 1 to enable, 0 to disable.
enable_reactions = 1  # 1 to enable, 0 to disable.
comment_box_above_comments = true
light_theme = "noborder_light"
dark_theme = "noborder_dark"
lang = ""  # Leave blank to match the page's language.
lazy_loading = true

