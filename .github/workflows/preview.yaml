name: Deploy GitHub Pages Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        if: github.event.action != 'closed'
        with:
          enable-cache: true
      - name: Build
        if: github.event.action != 'closed'
        run: uv run --locked python scripts/social_cards.py && uv run --locked zensical build --strict
        working-directory: ./www

      - name: Deploy Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./www/site
