name: Deploy GitHub Pages Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        if: github.event.action != 'closed'
      - uses: cachix/cachix-action@v15
        if: github.event.action != 'closed'
        with:
          name: danielgafni
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Install devenv
        if: github.event.action != 'closed'
        run: nix profile install github:cachix/devenv/v2.3.1 --accept-flake-config
      - name: Zola Build
        if: github.event.action != 'closed'
        run: devenv shell -- zola --root www build --drafts --base-url https://danielgafni.github.io/website/pr-preview/pr-${{ github.event.number }}

      - name: Deploy Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./www/public
